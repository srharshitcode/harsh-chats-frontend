<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Welcome to HARSH AND RIGISHA Chat </h1>
        <div class="mb-4">
            <label for="username" class="block text-gray-700 font-medium mb-2">Enter Your Username</label>
            <input type="text" id="username" placeholder="Your username" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 transition duration-200">Join Chat</button>
        <p id="error" class="text-red-500 text-center mt-2 hidden">Please enter a username</p>
    </div>

    <script>
        async function login() {
            const usernameInput = document.getElementById('username');
            const error = document.getElementById('error');
            const username = usernameInput.value.trim();

            if (!username) {
                error.classList.remove('hidden');
                return;
            }

            error.classList.add('hidden');
            try {
                const response = await fetch('https://harsh-chats.onrender.com/create_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await response.json();
                // Store user_id and username in localStorage
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('username', data.username);
                // Redirect to chat page
                window.location.href = 'chat.html';
            } catch (e) {
                error.textContent = 'Error joining chat. Try again.';
                error.classList.remove('hidden');
            }
        }

        // Handle Enter key for login
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
