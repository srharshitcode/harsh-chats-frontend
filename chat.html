<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARSH AND RIGISHA Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chatbox {
            height: 400px;
            overflow-y: scroll;
            background-color: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        .message {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            max-width: 80%;
        }
        .message.self {
            background-color: #3b82f6;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .message.other {
            background-color: #e5e7eb;
            color: black;
        }
        .notification {
            color: #6b7280;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Chat Room</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600">Logout</button>
        </div>
        <div id="chatbox" class="mb-4"></div>
        <div class="flex">
            <input type="text" id="message" placeholder="Type a message..." class="flex-1 p-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="sendMessage()" class="bg-blue-500 text-white p-2 rounded-r-lg hover:bg-blue-600">Send</button>
        </div>
    </div>

    <script>
        let ws = null;
        const userId = localStorage.getItem('user_id');
        const username = localStorage.getItem('username');

        if (!userId || !username) {
            window.location.href = 'index.html';
        }

        async function initializeChat() {
            // Connect to WebSocket
            ws = new WebSocket(`wss://harsh-chats.onrender.com/ws/${userId}`);
            ws.onmessage = function(event) {
                const chatbox = document.getElementById('chatbox');
                const messageDiv = document.createElement('div');
                const messageText = event.data;

                if (messageText.includes('has joined the chat') || messageText.includes('has left the chat')) {
                    messageDiv.className = 'notification';
                    messageDiv.textContent = messageText;
                } else {
                    const [sender, content] = messageText.split(': ');
                    messageDiv.className = `message ${sender === username ? 'self' : 'other'}`;
                    messageDiv.textContent = messageText;
                }

                chatbox.appendChild(messageDiv);
                chatbox.scrollTop = chatbox.scrollHeight;
            };
            ws.onclose = function() {
                const chatbox = document.getElementById('chatbox');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'notification';
                messageDiv.textContent = 'Disconnected from server';
                chatbox.appendChild(messageDiv);
            };
        }

        function sendMessage() {
            const input = document.getElementById('message');
            if (input.value && ws) {
                ws.send(input.value);
                input.value = '';
            }
        }

        function logout() {
            localStorage.removeItem('user_id');
            localStorage.removeItem('username');
            if (ws) ws.close();
            window.location.href = 'index.html';
        }

        // Initialize chat on page load
        window.onload = initializeChat;

        // Handle Enter key for sending messages
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
